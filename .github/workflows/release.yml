name: Attach ipk to release

# Runs the moment a release is published (normal flow going forward), and
# can also be triggered by hand against an already-existing release tag
# (e.g. to fix one that was published before this workflow existed, without
# deleting/recreating it).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the built ipk to"
        required: true

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ipk
        run: ./build.sh

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          gh release upload "$TAG" ./*.ipk --repo "${{ github.repository }}" --clobber
