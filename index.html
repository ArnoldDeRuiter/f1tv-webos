<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
(function(){
  var DEST = "https://f1tv.formula1.com";
  var navigated = false;
  function go() {
    if (navigated) return;
    navigated = true;
    location.href = DEST;
  }
  // Netflix ships with supportQuickStart:true baked into its own manifest,
  // so it preloads in the background regardless of the TV's own Quick
  // Start+ setting -- confirmed via a live crash where free RAM hit 42MB
  // right as a video stream switch needed a large allocation, with Netflix
  // sitting on ~90MB in the background the whole time. Killing it here is
  // a one-shot, fire-and-forget action (unlike YouTube, confirmed live to
  // stay dead rather than being respawned by the platform).
  var appDir = "/media/developer/apps/usr/palm/applications/nl.arnolderuiter.f1tv";
  var startBackgroundCommand =
    "sh " + appDir + "/kill-netflix.sh; sh " + appDir + "/start-loginfill.sh";
  try {
    var bridge = new PalmServiceBridge();
    bridge.onservicecallback = go;
    bridge.call("luna://org.webosbrew.hbchannel.service/exec", JSON.stringify({command: startBackgroundCommand}));
  } catch (e) {
    go();
  }
  setTimeout(go, 2000);
})();
</script>
</head>
<body></body>
</html>
